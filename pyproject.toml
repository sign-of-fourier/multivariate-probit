[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "multivariate-probit"
version = "0.1.0"
description = "Multivariate probit models fitted by Inference Functions for Margins (IFM), with pluggable inner models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Mark Shipman" }]
keywords = ["multivariate probit", "copula", "IFM", "correlated binary outcomes", "xgboost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.1"]
xgboost = ["xgboost>=1.7", "scikit-learn>=1.1"]
all = ["scikit-learn>=1.1", "xgboost>=1.7"]
dev = ["pytest>=7", "scikit-learn>=1.1", "xgboost>=1.7"]

[project.urls]
Homepage = "https://github.com/sign-of-fourier/multivariate-probit"
Documentation = "https://github.com/sign-of-fourier/multivariate-probit/blob/main/docs/ifm.md"
Issues = "https://github.com/sign-of-fourier/multivariate-probit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/multivariate_probit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
